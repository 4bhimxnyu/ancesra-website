# About every 30 minutes: add the website's new downloads to download.md.
# Uses the workflow's own GITHUB_TOKEN (given automatically), so no personal
# token is needed. Can also be started by hand from the Actions tab.
#
# The minutes are :07 and :37, not :00/:30: GitHub delays or drops scheduled
# runs at the busiest times (the top and half of the hour). With "*/30" not a
# single scheduled run happened on 9 Nov 2026.
name: Sync downloads

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-downloads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add new downloads to download.md
        run: node scripts/sync-downloads.mjs
      - name: Commit
        run: |
          if git diff --quiet -- download.md .downloads-synced; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "ancesra downloads"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download.md .downloads-synced
          git commit -m "Downloads: $(grep -o 'Total downloads: \*\*[0-9]*' download.md | grep -o '[0-9]*$') total"
          git push
